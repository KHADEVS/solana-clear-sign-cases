name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Cases, probes, decoding, advisories and Codama's displays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Codama
        run: npm --prefix tools/codama ci
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: The converted Anchor IDLs and the cases rebuild exactly as committed
        run: |
          node tools/codama/from-anchor.mjs
          cargo run --locked --bin gen
          node tools/codama/generate.mjs
          git diff --exit-code -- cases idl
      - name: Decoding and advisories
        run: cargo run --locked --bin check
      - name: Expected displays match Codama's output
        run: node tools/codama/generate.mjs --check
      - name: The probes hold what Codama gives
        run: node tools/codama/probes.mjs --check
      - name: The Rust display against four Mainnet blocks
        run: |
          gunzip -k real/survey/instructions.jsonl.gz
          cargo run --locked --release --bin compare
