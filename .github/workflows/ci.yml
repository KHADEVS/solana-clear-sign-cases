name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Decoding and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Cases are generated as committed
        run: |
          cargo run --locked --bin gen
          git diff --exit-code -- cases idl

  codama:
    name: Codama's displays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Codama
        run: npm --prefix tools/codama ci
      - name: Expected displays match Codama's output
        run: node tools/codama/generate.mjs --check
